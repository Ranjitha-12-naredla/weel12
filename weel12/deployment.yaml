apiVersion: apps/v1
kind: Deployment

metadata:
  name: week12-flask

spec:
  replicas: 2

  selector:
    matchLabels:
      app: week12-flask

  template:
    metadata:
      labels:
        app: week12-flask

    spec:
      containers:
        - name: week12-flask
          image: ranjitha28/week12-flask:latest

          ports:
            - containerPort: 5000